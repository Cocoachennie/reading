services:
  - type: web
    name: leaf-reading
    runtime: python
    plan: free
    buildCommand: python -m unittest discover -s tests -v
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: PUBLIC_MODE
        value: "1"
